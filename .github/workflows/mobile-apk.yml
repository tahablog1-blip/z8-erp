# يبني تطبيق تابلت الكاشير (Flutter) ويرفع ملف APK كـ artifact — شغّله يدوياً من تبويب Actions أو يعمل عند تغيير mobile/
name: mobile-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE || 'https://z8masdr.duckdns.org' }}
      - uses: actions/upload-artifact@v4
        with: { name: z8-pos-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
