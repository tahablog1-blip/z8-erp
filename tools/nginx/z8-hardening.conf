# tools/nginx/z8-hardening.conf — حماية من الإغراق (DoS) وإساءة الاستخدام لواجهة Z8
# طريقة التركيب على السيرفر:
#   1) الجزء «http-level» يوضع داخل كتلة http { } (مثلاً /etc/nginx/conf.d/z8-zones.conf — الملفات في conf.d تُضمَّن داخل http تلقائياً)
#   2) الجزء «location-level» ينسخ داخل كتلة server { } الخاصة بالموقع (مع الإبقاء على proxy_pass الحالي)
#   3) sudo nginx -t && sudo systemctl reload nginx
# الأرقام معتدلة لموقع نشاطه بشري (كاشير/موظفون) — ارفعها لو ظهرت 429 لمستخدمين حقيقيين (راجع error.log: "limiting requests").

# ═════════ http-level ═════════
limit_req_zone  $binary_remote_addr  zone=z8_api:10m     rate=20r/s;     # عام لكل IP (لوحة القيادة تستعلم كل 15 ث)
limit_req_zone  $binary_remote_addr  zone=z8_login:10m   rate=10r/m;     # الدخول و2FA: يمنع تخمين كلمات المرور
limit_req_zone  $binary_remote_addr  zone=z8_public:10m  rate=5r/s;      # الحجز العام/روابط الحالة/OTP
limit_req_zone  $binary_remote_addr  zone=z8_camera:10m  rate=1r/s;      # بث الكاميرا العام (كل طلب يفتح RTSP على السيرفر)
limit_conn_zone $binary_remote_addr  zone=z8_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# ═════════ location-level (داخل server { }) ═════════
# حدود عامة للطلب (تخفف Slowloris وتضخيم الجسم)
client_max_body_size      25m;      # رفع الصور/النسخ — الافتراضي 1m يرفض الصور، ولا تتركه بلا حد
client_body_timeout       15s;
client_header_timeout     15s;
send_timeout              30s;
keepalive_timeout         30s;
limit_conn z8_conn 40;

location = /api/auth/login            { limit_req zone=z8_login burst=5 nodelay;   proxy_pass http://127.0.0.1:3000; }
location = /api/auth/2fa/verify-login { limit_req zone=z8_login burst=5 nodelay;   proxy_pass http://127.0.0.1:3000; }
location /api/cars/public/             { limit_req zone=z8_public burst=20 nodelay; proxy_pass http://127.0.0.1:3000; }
location /api/service-notes/public/    { limit_req zone=z8_public burst=20 nodelay; proxy_pass http://127.0.0.1:3000; }
location /api/products/public/         { limit_req zone=z8_public burst=40 nodelay; proxy_pass http://127.0.0.1:3000; }
location /api/cameras/public-live/     { limit_req zone=z8_camera burst=3 nodelay;  proxy_pass http://127.0.0.1:3000; }
location /api/payments/webhook         { limit_req zone=z8_public burst=10 nodelay; proxy_pass http://127.0.0.1:3000; }
location /api/                         { limit_req zone=z8_api burst=60 nodelay;    proxy_pass http://127.0.0.1:3000; }
# ⚠ استبدل proxy_pass أعلاه بنفس الوجهة والترويسات المستعملة حالياً في إعداد الموقع (يمرّ كل شيء عبر Next على 3000 ثم يُعاد توجيه /api للخلفية)،
#   وأبقِ أي كتلة location خاصة بـ WebSocket (/api/auto-checkin/ws) بترويسات Upgrade كما هي.

# إخفاء نسخة nginx
server_tokens off;
